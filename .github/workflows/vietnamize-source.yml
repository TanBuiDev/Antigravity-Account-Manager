name: Migrate Vietnamese UI fallbacks
on:
  push:
    branches: [chore/vietnamese-default-remove-chinese-locales]
    paths:
      - scripts/vietnamize_source.cjs
      - src/**
      - src-tauri/src/**
      - crates/cockpit-core/src/**
      - .github/workflows/vietnamize-source.yml
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'TanBuiDev/Antigravity-Account-Manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/vietnamize_source.cjs --write
      - run: node scripts/vietnamize_source.cjs --check
      - name: Save localized source and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs/i18n/chinese-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(i18n): Vietnamese fallbacks and Chinese audit"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
