name: 🚀 Build Matrix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "feature/build-matrix*"
      - "feature/build-matrix/**"

concurrency:
  group: build-matrix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight-locales:
    name: "🔍 Preflight: Check Locales"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 🌐 Check locales
        run: node scripts/check_locales.cjs

      - name: 🇻🇳 Verify no translatable Chinese i18next fallback remains
        run: node scripts/vietnamize_source.cjs --check --verbose

      - name: 🦀 Check Antigravity Rust localization and bundled resources
        run: node scripts/check_antigravity_rust_i18n.cjs

      - name: 🖥️ Check active Antigravity screen localization
        run: node scripts/check_antigravity_frontend_i18n.cjs

  preflight-typecheck:
    name: "🔍 Preflight: Typecheck"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 🛡️ Typecheck
        run: npm run typecheck

  preflight-tests:
    name: "🧪 Preflight: Regression Tests"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🧪 TypeScript regression tests
        run: npm test

      - name: 🧪 Release script tests
        run: npm run test:release

      - name: 🐹 Go sidecar tests
        run: npm run test:go

  preflight-ts-windows:
    name: "🪟 Preflight: TypeScript Tests"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🧪 TypeScript regression tests
        run: npm test

  build:
    # Windows 10/11 x64 is the only supported desktop distribution target.
    name: "🏗️ Build: Windows x64"
    needs: [preflight-locales, preflight-typecheck, preflight-tests, preflight-ts-windows]
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "windows-x64"
            platform: "windows-latest"
            args: ""
            release_dir: "target/release"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.label }}

      - name: 🧪 Test Codex context preservation (Windows)
        working-directory: src-tauri
        run: |
          cargo test instance_configuration_save --lib
          cargo test quick_config_catalog_only_context_preservation --lib

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 🧪 Test core Rust library (Windows)
        run: npm run test:rust:core

      - name: 💾 Cache Tauri tooling
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-deps-${{ matrix.platform }}-${{ hashFiles('package-lock.json', '**/Cargo.toml') }}
          restore-keys: |
            tauri-deps-${{ matrix.platform }}-

      # Keep the private key out of PR code, dependency scripts, and third-party actions.
      - name: 🔐 Check signing availability
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏗️ Build app (Unsigned CI)
        if: github.event_name == 'pull_request' || steps.signing.outputs.available != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx tauri build --ci --config src-tauri/tauri.ci.conf.json ${{ matrix.args }} 2>&1 | tee "build-${{ matrix.label }}.log"

      - name: 📜 Print unsigned build logs on failure
        if: failure() && (github.event_name == 'pull_request' || steps.signing.outputs.available != 'true')
        shell: bash
        run: |
          echo "=== UNSIGNED BUILD LOG ==="
          if [ -f "build-${{ matrix.label }}.log" ]; then
            tail -n 200 "build-${{ matrix.label }}.log"
          else
            echo "Log file not found"
          fi

      - name: 🏗️ Build app (Signed)
        if: github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --ci ${{ matrix.args }} 2>&1 | tee "build-${{ matrix.label }}.log"

      - name: 📜 Print signed build logs on failure
        if: failure() && github.event_name != 'pull_request' && steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          echo "=== BUILD LOG (SIGNED) ==="
          if [ -f "build-${{ matrix.label }}.log" ]; then
            tail -n 200 "build-${{ matrix.label }}.log"
          else
            echo "Log file not found"
          fi

      - name: 📊 Summarize build warnings
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          log_file="build-${{ matrix.label }}.log"
          warnings_file="warnings-${{ matrix.label }}.txt"

          if [ ! -f "$log_file" ]; then
            : > "$warnings_file"
            {
              echo "### 🏗️ Build Summary: ${{ matrix.label }}"
              echo
              echo "❌ **The build did not produce a log; warning analysis is unavailable.**"
              echo
              echo "---"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Cargo emits ANSI color codes in CI, so normalize the log before matching.
          if sed $'s/\033\\[[0-9;]*m//g' "$log_file" | grep -n "^warning:" > "$warnings_file"; then
            warning_count="$(wc -l < "$warnings_file" | tr -d ' ')"
          else
            : > "$warnings_file"
            warning_count="0"
          fi

          {
            echo "### 🏗️ Build Summary: ${{ matrix.label }}"
            echo
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ **Build failed with ${warning_count} warning(s).**"
            elif [ "${warning_count}" -eq "0" ]; then
              echo "✅ **Build completed with 0 warnings.**"
            else
              echo "⚠️ **Build completed with ${warning_count} warning(s).**"
            fi

            if [ -s "$warnings_file" ]; then
              echo
              echo "<details>"
              echo "<summary>🔍 Show warning logs (up to 200 lines)</summary>"
              echo
              echo '```text'
              sed -n '1,200p' "$warnings_file"
              echo '```'
              echo "</details>"
            fi
            echo
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.label }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build-${{ matrix.label }}.log
            warnings-${{ matrix.label }}.txt

      - name: 📤 Upload build bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ matrix.release_dir }}/bundle
